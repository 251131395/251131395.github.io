  <style>
    header button span {

@media (max-width: 768px) {
  #scrollLeft,
  #scrollRight {
    display: none;
  }
  #categoryContainer {
    padding-left: 16px;
    padding-right: 16px;
  }
}

.sticker-item {
  cursor: pointer;
}

.category-chip {
  padding: 5px 10px 5px;
  margin-right: 3px;
  border-radius: 8px;
  background-color: #eee;
  font-weight: bold;
}
.dark .category-chip {
  background-color: #222;
  color: #fff;
}
.category-chip.active {
  background-color: #000;
  color: #fff;
  transform: scale(1.05);
}
.dark .category-chip.active {
  background-color: #fff;
  color: #000;
  transform: scale(1.05);
}

.slider-container {
  position: relative;
}
.slider {
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: 3px;
  background: #ddd;
  outline: none;
  transition: background 0.3s;
}
.dark .slider {
  background: #444;
}
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #666;
  cursor: pointer;
  transition: all 0.2s;
}
.slider::-moz-range-thumb {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  background: #666;
  cursor: pointer;
  border: none;
}

.loading-spinner {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #5d5cde;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  0% {
    transform: rotate(0deg);
  }

  100% {
    transform: rotate(360deg);
  }
}

.canvas-shell {
  position: sticky;
  top: 0;
  margin: -16px;
  padding: 16px;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
canvas {
  position: sticky;
  top: 0;
  width: auto;
  height: 40vh;
}

#editorTitle {
    padding:0 16px 0;
  z-index:60;
  }

@media (min-width: 640px) {
  .canvas-shell {
    position: sticky;
    top: 0;
    height: 100vh;
  }
  canvas {
    width: 100%;
    height: auto;
  }

  #editorTitle {
    position: fixed;
    top: 16px;
    left: 40px;
    padding:0 16px 0;
    width:calc(100% - 50px);
    overflow:hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
}

#categoryContainer::-webkit-scrollbar {
  display: none;
}

.tag-chip {
  display: inline-block;
  background-color: #e5e7eb;
  color: #374151;
  font-size: 0.75rem;
  padding: 2px 6px;
  border-radius: 4px;
  margin-right: 4px;
  margin-bottom: 2px;
}
.dark .tag-chip {
  background-color: #4b5563;
  color: #d1d5db;
}

  </style>

function initTheme() {
  if (
    window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches
  ) {
    document.documentElement.classList.add("dark");
  }
  window
    .matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", (event) => {
      if (event.matches) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    });
}
// Sticker data

let currentSticker = null;
let currentImage = null;
let canvas = null;
let ctx = null;
let filteredStickers = [...stickers];

// Initialize app
document.addEventListener("DOMContentLoaded", function () {
  initTheme();
  setupEventListeners();
  loadStickers();
});

function setupEventListeners() {
  // Theme toggle
  document.getElementById("themeToggle").addEventListener("click", function () {
    document.documentElement.classList.toggle("dark");
  });
  // Category filters
  document.querySelectorAll(".category-chip").forEach((chip) => {
    chip.addEventListener("click", function () {
      document
        .querySelectorAll(".category-chip")
        .forEach((c) => c.classList.remove("active"));
      this.classList.add("active");
      filterStickers(this.dataset.category);
    });
  });
  // Navigation
  document.getElementById("backBtn").addEventListener("click", function () {
    showHomePage();
  });
  // Category scroll buttons
  document.getElementById("scrollLeft").addEventListener("click", function () {
    const container = document.getElementById("categoryContainer");
    container.scrollBy({
      left: -150,
      behavior: "smooth"
    });
  });
  document.getElementById("scrollRight").addEventListener("click", function () {
    const container = document.getElementById("categoryContainer");
    container.scrollBy({
      left: 150,
      behavior: "smooth"
    });
  });
  // Editor controls
  setupEditorControls();
}

function loadStickers() {
  const grid = document.getElementById("stickersGrid");
  grid.innerHTML = "";
  filteredStickers.forEach((sticker) => {
    const stickerElement = createStickerElement(sticker);
    grid.appendChild(stickerElement);
  });
}

function createStickerElement(sticker) {
  const div = document.createElement("div");
  div.className = "sticker-item rounded-xl";
  // Format date for display
  const formatDate = (dateStr) => {
    const date = new Date(dateStr);
    const now = new Date();
    const diffTime = Math.abs(now - date);
    const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

    if (diffDays === 0) {
      return "今天";
    } else if (diffDays === 1) {
      return "昨天";
    } else if (diffDays < 7) {
      return `${diffDays} 天前`;
    } else if (diffDays < 30) {
      const weeks = Math.floor(diffDays / 7);
      return `${weeks} 週前`;
    } else if (diffDays < 365) {
      const months = Math.floor(diffDays / 30);
      return `${months} 個月前`;
    } else {
      const years = Math.floor(diffDays / 365);
      return `${years} 年前`;
    }
  };
  // Create tags HTML
  const tagsHtml = sticker.tags
    .map((tag) => `<span class="tag-chip">#${tag}</span>`)
    .join("");
  div.innerHTML = `
    <div class="aspect-square mb-2 overflow-hidden">
      <img src="${sticker.url}" alt="${
    sticker.name
  }" class="w-full h-full object-contain">
    </div>
    <p class="text-base text-gray-700 dark:text-gray-300 text-left font-bold mb-1 overflow-hidden whitespace-nowrap text-ellipsis">${
      sticker.name
    }</p>
    <div class="mb-2 overflow-hidden" style="max-height: 1.5rem;">
      ${tagsHtml}
    </div>
    <p class="text-xs text-gray-500 dark:text-gray-400 text-left">${formatDate(
      sticker.date
    )}</p>
  `;
  div.addEventListener("click", function () {
    openEditor(sticker);
  });
  return div;
}

function filterStickers(category) {
  if (category === "all") {
    filteredStickers = [...stickers];
  } else if (category === "recent") {
    // Sort by date (most recent first)
    filteredStickers = [...stickers].sort(
      (a, b) => new Date(b.date) - new Date(a.date)
    );
  } else if (category === "recommended") {
    // Show only recommended items
    filteredStickers = stickers.filter((sticker) => sticker.recommended);
  } else {
    // Filter by category
    filteredStickers = stickers.filter(
      (sticker) => sticker.category === category
    );
  }

  loadStickers();
}

function showHomePage() {
  document.getElementById("homePage").classList.remove("hidden");
  document.getElementById("editorPage").classList.add("hidden");
}

function openEditor(sticker) {
  currentSticker = sticker;
  document.getElementById("homePage").classList.add("hidden");
  document.getElementById("editorPage").classList.remove("hidden");
  // Update editor title
  document.getElementById("editorTitle").textContent = sticker.name;
  loadImageToEditor(sticker.url);
}

function loadImageToEditor(imageUrl) {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = function () {
    currentImage = img;
    canvas = document.getElementById("previewCanvas");
    ctx = canvas.getContext("2d");
    // Set canvas size
    const maxSize = 1080;
    const scale = Math.min(maxSize / img.width, maxSize / img.height);
    canvas.width = img.width * scale;
    canvas.height = img.height * scale;
    resetEditor();
    updatePreview();
  };
  img.onerror = function () {
    console.error("Failed to load image:", imageUrl);
    // Try loading without crossOrigin for fallback
    const fallbackImg = new Image();
    fallbackImg.onload = function () {
      currentImage = fallbackImg;
      canvas = document.getElementById("previewCanvas");
      ctx = canvas.getContext("2d");
      const maxSize = 1080;
      const scale = Math.min(
        maxSize / fallbackImg.width,
        maxSize / fallbackImg.height
      );
      canvas.width = fallbackImg.width * scale;
      canvas.height = fallbackImg.height * scale;
      resetEditor();
      updatePreview();
    };
    fallbackImg.src = imageUrl;
  };
  img.src = imageUrl;
}

function setupEditorControls() {
  const controls = [
    {
      id: "hueSlider",
      valueId: "hueValue",
      suffix: "°"
    },
    {
      id: "saturationSlider",
      valueId: "saturationValue",
      suffix: "%"
    },
    {
      id: "brightnessSlider",
      valueId: "brightnessValue",
      suffix: "%"
    },
    {
      id: "contrastSlider",
      valueId: "contrastValue",
      suffix: "%"
    },
    {
      id: "shadowXSlider",
      valueId: "shadowXValue",
      suffix: "px"
    },
    {
      id: "shadowYSlider",
      valueId: "shadowYValue",
      suffix: "px"
    },
    {
      id: "shadowBlurSlider",
      valueId: "shadowBlurValue",
      suffix: "px"
    },
    {
      id: "shadowOpacitySlider",
      valueId: "shadowOpacityValue",
      suffix: "%"
    }
  ];
  controls.forEach((control) => {
    const slider = document.getElementById(control.id);
    const valueDisplay = document.getElementById(control.valueId);
    slider.addEventListener("input", function () {
      valueDisplay.textContent = this.value + control.suffix;
      updatePreview();
    });
  });
  document.getElementById("resetBtn").addEventListener("click", resetEditor);
  document
    .getElementById("resetBtn-top")
    .addEventListener("click", resetColorAdjustments);
  document
    .getElementById("resetBtn-bottom")
    .addEventListener("click", resetShadowEffects);
  document
    .getElementById("downloadBtn")
    .addEventListener("click", downloadImage);
}

function updatePreview() {
  if (!currentImage || !canvas || !ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Get values
  const hue = document.getElementById("hueSlider").value;
  const saturation = document.getElementById("saturationSlider").value;
  const brightness = document.getElementById("brightnessSlider").value;
  const contrast = document.getElementById("contrastSlider").value;
  const shadowX = document.getElementById("shadowXSlider").value;
  const shadowY = document.getElementById("shadowYSlider").value;
  const shadowBlur = document.getElementById("shadowBlurSlider").value;
  const shadowOpacity = document.getElementById("shadowOpacitySlider").value;
  // Apply shadow
  ctx.shadowColor = `rgba(0, 0, 0, ${shadowOpacity / 100})`;
  ctx.shadowOffsetX = shadowX;
  ctx.shadowOffsetY = shadowY;
  ctx.shadowBlur = shadowBlur;
  // Apply filters
  ctx.filter = `
                hue-rotate(${hue}deg)
                saturate(${saturation}%)
                brightness(${brightness}%)
                contrast(${contrast}%)
            `;
  // Draw image
  ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
  // Reset shadow and filter
  ctx.shadowColor = "transparent";
  ctx.filter = "none";
}

function resetEditor() {
  document.getElementById("hueSlider").value = 0;
  document.getElementById("saturationSlider").value = 100;
  document.getElementById("brightnessSlider").value = 100;
  document.getElementById("contrastSlider").value = 100;
  document.getElementById("shadowXSlider").value = 0;
  document.getElementById("shadowYSlider").value = 0;
  document.getElementById("shadowBlurSlider").value = 10;
  document.getElementById("shadowOpacitySlider").value = 50;
  // Update value displays
  document.getElementById("hueValue").textContent = "0°";
  document.getElementById("saturationValue").textContent = "100%";
  document.getElementById("brightnessValue").textContent = "100%";
  document.getElementById("contrastValue").textContent = "100%";
  document.getElementById("shadowXValue").textContent = "0px";
  document.getElementById("shadowYValue").textContent = "0px";
  document.getElementById("shadowBlurValue").textContent = "10px";
  document.getElementById("shadowOpacityValue").textContent = "50%";
  updatePreview();
}

function downloadImage() {
  if (!canvas) return;
  // Create download link
  const link = document.createElement("a");
  link.download = `sticker_${currentSticker.name}_${Date.now()}.png`;
  link.href = canvas.toDataURL("image/png");
  link.click();
}
