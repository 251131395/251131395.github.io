  <style>
    body {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background-color: #fff;
}

.filter {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 888;
  animation: distort 20s ease-in infinite;
  pointer-events: none;
  opacity: 0.7;
}
@keyframes distort {
  0% {
    backdrop-filter: invert(0.2) opacity(0.2) hue-rotate(90deg) saturate(7)
      brightness(3);
    -webkit-backdrop-filter: invert(0.2) opacity(0.2) hue-rotate(90deg)
      saturate(7) brightness(3);
  }
  10% {
    backdrop-filter: opacity(0.2) hue-rotate(90deg) saturate(5) brightness(0.8);
    -webkit-backdrop-filter: opacity(0.2) hue-rotate(90deg) saturate(5)
      brightness(0.8);
  }
  50% {
    backdrop-filter: opacity(0.2) saturate(10) brightness(2);
    -webkit-backdrop-filter: opacity(0.2) saturate(10) brightness(2);
  }
  60% {
    backdrop-filter: invert(0.3) opacity(0.7) saturate(7) brightness(0.2);
    -webkit-backdrop-filter: invert(0.3) opacity(0.7) saturate(7)
      brightness(0.2);
  }
  61% {
    backdrop-filter: invert(0.3) opacity(0.2) hue-rotate(-20deg) saturate(2)
      brightness(1);
    -webkit-backdrop-filter: invert(0.3) opacity(0.2) hue-rotate(-20deg)
      saturate(2) brightness(1);
  }
  65% {
    backdrop-filter: opacity(0.5) saturate(1) brightness(3);
    -webkit-backdrop-filter: opacity(0.5) saturate(1) brightness(3);
  }
  100% {
    backdrop-filter: invert(0.2) opacity(0.2) hue-rotate(90deg) saturate(7)
      brightness(3);
    -webkit-backdrop-filter: invert(0.2) opacity(0.2) hue-rotate(90deg)
      saturate(7) brightness(3);
  }
}

.shell {

  align-items: center;

.logo {

.search-container {

.search-box-wrapper {

#eye{
  display:bock;

  top:0;
  left:-1px;

  z-index: 888;
  animation: eye 20s infinite;
}
@keyframes eye {
  0% {
    display:none;
  }
  49% {
    display:none;
  }
  50% {
    display:block;
  }
  51% {

  50% {

  100% {

.search-box {

  align-items: center;
  border: 1px solid rgba(223, 225, 229, 1);
  border-radius: 24px;
  padding: 13px;
  background-color: #fff;

  overflow: hidden;
  cursor: text;
}
.search-box:hover {
  border: 1px solid rgba(223, 225, 229, 0.5);
}
.search-box:focus-within {
  border: 1px solid rgba(223, 225, 229, 0.5);

  border-top-left-radius: 24px;

.search-box input {

}
.search-box button {

  color: #70757a;

}
.search-buttons {

}
.search-buttons button {

.search-buttons button:hover {

.history-dropdown {

  left: 1px;
  right: 1px;

  border-bottom-left-radius: 24px;
  border-bottom-right-radius: 24px;
  box-shadow: 0 5px 5px rgba(32, 33, 36, 0.2);
  z-index: 100;
  overflow: hidden;
}
.history-dropdown ul {

  padding: 10px 0;

}
.history-dropdown li {
  postion: relative;
  padding: 12px 15px;
  0padding-left: 56px;
  border-top-right-radius: 24px;
  border-bottom-right-radius: 24px;
  cursor: pointer;
  font-size: 16px;
  color: #202124;
  white-space: nowrap;
  overflow: hidden;
}
.history-dropdown li:hover {
  background-color: #eee;
}
.history-dropdown li:hover:after {
  color: #777;
  content: "X";
  position: absolute;
  right: 36px;
  transform: scale(1, 0.8);
}
.history-dropdown li i {
  font-size: 12px;
  margin-left: 4px;
  margin-right: 18px;
  color: #777;
}
.search-box:focus-within + .history-dropdown {
  display: block;
}
