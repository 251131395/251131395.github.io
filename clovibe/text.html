      -webkit-filter: blur(200px);
      background-size: cover;
      background-position: center;
      background-image: url("");

</head>

  <script>
    // JavaScript to show the floating div with fade-in effect when scrolled to 100px
    window.addEventListener("scroll", function() {
      const floatingDiv = document.getElementById("floating-div");
      if (window.scrollY > 215) {
        // Add the "visible" class to trigger the fade-in
        floatingDiv.classList.add("visible");
      } else {
        // Remove the "visible" class to hide the div
        floatingDiv.classList.remove("visible");
      }
    });
    // Music Player Implementation
    document.addEventListener("DOMContentLoaded", function() {
      // Song data
      const songs = [{

        },
        {

          artists: "251131395",
          song: "https://251131395.github.io/media/audio/music/%E6%B5%B7%E6%B4%8B%E6%90%96%E7%B1%83%E6%9B%B2(%E5%A6%82%E7%84%A1%E6%84%8F%E5%A4%96).mp3",
          duration: 135
        },
        {
          name: "Falling Stars - 夜間田野",
          img: "https://images.unsplash.com/photo-1494179628276-420ae3a2842a?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NDgxNzYzMzF8&ixlib=rb-4.1.0&q=80&w=400",
          artists: "251131395",
          song: "https://251131395.github.io/media/audio/music/Falling%20Stars-%E7%94%B0%E9%87%8E%E7%89%88.mp3",
          duration: 135
        },
        {
          name: "在過去暢想未來 - 音樂盒",
          img: "https://images.unsplash.com/photo-1622403718261-bd0e7dd01216?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mjd8fGNoaWxkaG9vZHxlbnwwfHwwfHx8MA%3D%3D",
          artists: "251131395",
          song: "https://251131395.github.io/media/audio/music/%E5%9C%A8%E9%81%8E%E5%8E%BB%E6%9A%A2%E6%83%B3%E6%9C%AA%E4%BE%86-music-box.mp3",
          duration: 89
        },
        {
          name: "最後的最後",
          img: "https://images.unsplash.com/photo-1583691028182-e8f01e74bfa2?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NDgxNzMxODZ8&ixlib=rb-4.1.0&q=80&w=400",
          artists: "251131395",
          song: "https://pfst.cf2.poecdn.net/base/audio/c4bb32ee15164eba865cdab5416821916ef2295a47f1d260233089ccf8051770",
          duration: 38
        },
        {
          name: "最後的最後 - 伴奏",
          img: "https://images.unsplash.com/photo-1583691028182-e8f01e74bfa2?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NDgxNzMxODZ8&ixlib=rb-4.1.0&q=80&w=400",
          artists: "251131395",
          song: "https://pfst.cf2.poecdn.net/base/audio/c536e33bae8198e9d245037153c7bf149cd77a08721359094a775e55e3fedffb",
          duration: 38
        },
        {
          name: "最後的最後 - 鋼琴",
          img: "https://images.unsplash.com/photo-1583691028182-e8f01e74bfa2?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NDgxNzMxODZ8&ixlib=rb-4.1.0&q=80&w=400",
          artists: "251131395",
          song: "https://pfst.cf2.poecdn.net/base/audio/c41e65aee6bfd976153bd9ebd3063ab01d7a3630fe2c519ec2aa92124a6214d3",
          duration: 38
        },
        {
          name: "最後的最後 - 鋼琴伴奏",
          img: "https://images.unsplash.com/photo-1583691028182-e8f01e74bfa2?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3NDgxNzMxODZ8&ixlib=rb-4.1.0&q=80&w=400",
          artists: "251131395",
          song: "https://pfst.cf2.poecdn.net/base/audio/bf53a3956b551913b295f1af08314f860cb076a826b78ec36cb229a03f892303",
          duration: 38
        }
      ];
      let currentSongIndex = 0;
      let isPlaying = false;
      let isRandom = false;
      let isFavorite = false;
      let isRepeat = false; // false: no repeat, true: repeat current song
      let audioPlayer = document.getElementById("audio-player");
      let progressBar = document.getElementById("progress-bar");
      let progressPin = document.getElementById("progress-pin");
      let progressSlider = document.getElementById("progress-slider");
      let currentTimeDisplay = document.getElementById("current-time");
      let totalTimeDisplay = document.getElementById("total-time");
      let playButton = document.getElementById("p-play");
      let prevButton = document.getElementById("p-previous");
      let nextButton = document.getElementById("p-next");
      let cycleButton = document.getElementById("p-cycle");
      let listPlayButton = document.getElementById("list-play");
      let randomButton = document.getElementById("list-random");
      let heartButton = document.getElementById("list-heart");
      let songListContainer = document.getElementById("song-list");
      let songInfoElement = document.querySelector(".p-song-info");
      let isDragging = false;
      let touchStartX = 0;
      let touchEndX = 0;
      // Track playback history
      let playHistory = [];
      // Function to check if text is overflowing its container
      function isTextOverflowing(element) {
        return element.scrollWidth > element.clientWidth;
      }
      // Function to apply scrolling animation if needed
      function applyScrollingIfNeeded() {
        const songNameEl = document.getElementById("p-song-name");
        const artistsEl = document.getElementById("p-song-artists");
        // Clear previous content
        songNameEl.innerHTML = songs[currentSongIndex].name;
        artistsEl.innerHTML = songs[currentSongIndex].artists;
        // Check if text is overflowing and apply animation
        if (isTextOverflowing(songNameEl)) {
          songNameEl.innerHTML = `<span class="scrolling-text">${songs[currentSongIndex].name}</span>`;
        }
        if (isTextOverflowing(artistsEl)) {
          artistsEl.innerHTML = `<span class="scrolling-text">${songs[currentSongIndex].artists}</span>`;
        }
      }
      // Populate song list
      function populateSongList() {
        songListContainer.innerHTML = "";
        songs.forEach((song, index) => {
          const minutes = Math.floor(song.duration / 60);
          const seconds = song.duration % 60;
          const timeStr = `${minutes}:${seconds < 10 ? "0" + seconds : seconds}`;
          const songElement = document.createElement("div");
          songElement.className = "song-shell";
          songElement.dataset.index = index;
          songElement.innerHTML = `
            <div class="song-img" style="background-image: url('${song.img}')"></div>
            <div class="song-left">
              <div class="song-name">${song.name}</div>
              <div class="song-artists">${song.artists}</div>
            </div>
            <div class="song-time">${timeStr}</div>
          `;
          songElement.addEventListener("click", () => {
            playSong(index);
          });
          songListContainer.appendChild(songElement);
        });
      }
      // Format time in seconds to MM:SS format
      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60);
        return `${minutes}:${remainingSeconds < 10 ? "0" + remainingSeconds : remainingSeconds}`;
      }
      // Update player UI with current song
      function updatePlayerUI() {
        const song = songs[currentSongIndex];
        document.getElementById("p-song-name").textContent = song.name;
        document.getElementById("p-song-artists").textContent = song.artists;
        // Apply scrolling to text if needed
        applyScrollingIfNeeded();
        // Update background color with song image
        document.getElementById(
          "p-bg-color"
        ).style.backgroundImage = `url('${song.img}')`;
        // Update active song in list
        document.querySelectorAll(".song-shell").forEach((el, i) => {
          if (i === currentSongIndex) {
            el.classList.add("active");
          } else {
            el.classList.remove("active");
          }
        });
        // Update media session metadata for background playback
        if ("mediaSession" in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: song.name,
            artist: song.artists,
            artwork: [{
              src: song.img,
              sizes: "512x512",
              type: "image/jpeg"
            }]
          });
          // Set media session action handlers
          navigator.mediaSession.setActionHandler("play", togglePlay);
          navigator.mediaSession.setActionHandler("pause", togglePlay);
          navigator.mediaSession.setActionHandler("previoustrack", playPrevious);
          navigator.mediaSession.setActionHandler("nexttrack", playNext);
        }
      }
      // Play a song by index
      function playSong(index) {
        if (index >= 0 && index < songs.length) {
          // Add current song to history before changing
          if (audioPlayer.src) {
            playHistory.push(currentSongIndex);
            // Keep history at a reasonable size
            if (playHistory.length > 20) {
              playHistory.shift();
            }
          }
          currentSongIndex = index;
          const song = songs[currentSongIndex];
          audioPlayer.src = song.song;
          audioPlayer.load();
          audioPlayer
            .play()
            .then(() => {
              isPlaying = true;
              playButton.innerHTML = `<i class="fa-solid fa-pause"></i>`;
              listPlayButton.querySelector(
                "span"
              ).innerHTML = `<i class="fa-solid fa-pause" style="transform: translate(0, 0);"></i>`;
              updatePlayerUI();
            })
            .catch((error) => {
              console.log("Playback error:", error);
            });
        }
      }
      // Toggle play/pause
      function togglePlay() {
        if (audioPlayer.src) {
          if (isPlaying) {
            audioPlayer.pause();
            isPlaying = false;
            playButton.innerHTML = `<i class="fa-solid fa-play"></i>`;
            listPlayButton.querySelector(
              "span"
            ).innerHTML = `<i class="fa-solid fa-play" style="transform: translate(2px, 0);"></i>`;
            // Update media session state
            if ("mediaSession" in navigator) {
              navigator.mediaSession.playbackState = "paused";
            }
          } else {
            audioPlayer
              .play()
              .then(() => {
                isPlaying = true;
                playButton.innerHTML = `<i class="fa-solid fa-pause"></i>`;
                listPlayButton.querySelector(
                  "span"
                ).innerHTML = `<i class="fa-solid fa-pause"></i>`;
                // Update media session state
                if ("mediaSession" in navigator) {
                  navigator.mediaSession.playbackState = "playing";
                }
              })
              .catch((error) => {
                console.log("Playback error:", error);
              });
          }
        } else if (songs.length > 0) {
          playSong(0);
        }
      }
      // Play next song
      function playNext() {
        let nextIndex;
        if (isRandom) {
          // Play a random song that's not the current one
          do {
            nextIndex = Math.floor(Math.random() * songs.length);
          } while (nextIndex === currentSongIndex && songs.length > 1);
        } else {
          // Play the next song in sequence
          nextIndex = (currentSongIndex + 1) % songs.length;
        }
        playSong(nextIndex);
      }
      // Play previous song
      function playPrevious() {
        // If we have history, play the last song from history
        if (playHistory.length > 0) {
          const prevIndex = playHistory.pop();
          // Skip adding to history again
          currentSongIndex = prevIndex;
          const song = songs[currentSongIndex];
          audioPlayer.src = song.song;
          audioPlayer.load();
          audioPlayer
            .play()
            .then(() => {
              isPlaying = true;
              playButton.innerHTML = `<i class="fa-solid fa-pause"></i>`;
              listPlayButton.querySelector(
                "span"
              ).innerHTML = `<i class="fa-solid fa-pause" style="transform: translate(0, 0);"></i>`;
              updatePlayerUI();
            })
            .catch((error) => {
              console.log("Playback error:", error);
            });
        } else {
          // If no history, go to beginning of current song
          if (audioPlayer.currentTime > 3) {
            audioPlayer.currentTime = 0;
          } else {
            // Or go to previous song in the list
            const prevIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            playSong(prevIndex);
          }
        }
      }
      // Toggle random play mode
      function toggleRandom() {
        isRandom = !isRandom;
        randomButton.classList.toggle("active", isRandom);
      }
      // Toggle favorite
      function toggleFavorite() {
        isFavorite = !isFavorite;
        heartButton.classList.toggle("active", isFavorite);
      }
      // Toggle repeat mode (single song repeat)
      function toggleRepeat() {
        isRepeat = !isRepeat; // Toggle between repeat and no-repeat
        cycleButton.classList.toggle("active", isRepeat);
      }
      // Handle song ending
      function handleSongEnd() {
        if (isRepeat) {
          // Repeat current song: replay from the beginning
          audioPlayer.currentTime = 0;
          audioPlayer.play();
        } else if (currentSongIndex < songs.length - 1 || isRandom) {
          // No Repeat but not the last song or in random mode: play next song
          playNext();
        } else {
          // No Repeat and last song - stop playing
          isPlaying = false;
          playButton.innerHTML = `<i class="fa-solid fa-play"></i>`;
          listPlayButton.querySelector(
            "span"
          ).innerHTML = `<i class="fa-solid fa-play" style="transform: translate(2px, 0);"></i>`;
        }
      }
      // Update progress bar based on current audio time
      function updateProgress() {
        if (!isDragging && audioPlayer.duration) {
          const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
          progressBar.style.width = `${percent}%`;
          progressPin.style.left = `${percent}%`;
          currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
        }
      }
      // Seek to position in song
      function seek(event) {
        const bounds = progressSlider.getBoundingClientRect();
        const percent = (event.clientX - bounds.left) / bounds.width;
        const seekTime = percent * audioPlayer.duration;
        audioPlayer.currentTime = seekTime;
        progressBar.style.width = `${percent * 100}%`;
        progressPin.style.left = `${percent * 100}%`;
      }
      // Initialize progress slider dragging
      function initProgressDrag(event) {
        isDragging = true;
        document.addEventListener("mousemove", handleProgressDrag);
        document.addEventListener("mouseup", stopProgressDrag);
        document.addEventListener("touchmove", handleProgressDrag);
        document.addEventListener("touchend", stopProgressDrag);
        // Handle the initial position
        handleProgressDrag(event);
      }
      // Handle progress slider dragging
      function handleProgressDrag(event) {
        if (isDragging) {
          const clientX =
            event.clientX || (event.touches && event.touches[0].clientX);
          if (clientX) {
            const bounds = progressSlider.getBoundingClientRect();
            let percent = (clientX - bounds.left) / bounds.width;
            percent = Math.max(0, Math.min(1, percent));
            progressBar.style.width = `${percent * 100}%`;
            progressPin.style.left = `${percent * 100}%`;
            currentTimeDisplay.textContent = formatTime(
              percent * audioPlayer.duration
            );
          }
        }
      }
      // Stop progress slider dragging
      function stopProgressDrag(event) {
        if (isDragging) {
          const clientX =
            event.clientX ||
            (event.changedTouches && event.changedTouches[0].clientX);
          if (clientX && audioPlayer.duration) {
            const bounds = progressSlider.getBoundingClientRect();
            let percent = (clientX - bounds.left) / bounds.width;
            percent = Math.max(0, Math.min(1, percent));
            audioPlayer.currentTime = percent * audioPlayer.duration;
          }
          isDragging = false;
          document.removeEventListener("mousemove", handleProgressDrag);
          document.removeEventListener("mouseup", stopProgressDrag);
          document.removeEventListener("touchmove", handleProgressDrag);
          document.removeEventListener("touchend", stopProgressDrag);
        }
      }
      // Swipe handling for song info element
      function handleTouchStart(event) {
        touchStartX = event.touches[0].clientX;
      }

      function handleTouchMove(event) {
        touchEndX = event.touches[0].clientX;
      }

      function handleTouchEnd() {
        const swipeThreshold = 50; // Minimum distance required for a swipe
        if (touchStartX - touchEndX > swipeThreshold) {
          // Swipe left - play next song
          playNext();
        } else if (touchEndX - touchStartX > swipeThreshold) {
          // Swipe right - play previous song
          playPrevious();
        }
        // Reset values
        touchStartX = 0;
        touchEndX = 0;
      }
      // Listen for window resize to check text overflow
      window.addEventListener('resize', applyScrollingIfNeeded);
      // Event Listeners
      audioPlayer.addEventListener("timeupdate", updateProgress);
      audioPlayer.addEventListener("loadedmetadata", () => {
        totalTimeDisplay.textContent = formatTime(audioPlayer.duration);
        currentTimeDisplay.textContent = "0:00";
        progressBar.style.width = "0%";
        progressPin.style.left = "0%";
      });
      audioPlayer.addEventListener("ended", handleSongEnd);
      playButton.addEventListener("click", togglePlay);
      listPlayButton.addEventListener("click", togglePlay);
      prevButton.addEventListener("click", playPrevious);
      nextButton.addEventListener("click", playNext);
      randomButton.addEventListener("click", toggleRandom);
      heartButton.addEventListener("click", toggleFavorite);
      cycleButton.addEventListener("click", toggleRepeat);
      progressSlider.addEventListener("click", seek);
      progressPin.addEventListener("mousedown", initProgressDrag);
      progressPin.addEventListener("touchstart", initProgressDrag);
      // Add touch event listeners for swipe functionality
      songInfoElement.addEventListener("touchstart", handleTouchStart, false);
      songInfoElement.addEventListener("touchmove", handleTouchMove, false);
      songInfoElement.addEventListener("touchend", handleTouchEnd, false);
      // Initialize the player
      populateSongList();
      if (songs.length > 0) {
        updatePlayerUI();
        audioPlayer.src = songs[0].song;
        audioPlayer.load();
        totalTimeDisplay.textContent = formatTime(songs[0].duration);
        // Set the background color to the first song's image initially
        document.getElementById(
          "p-bg-color"
        ).style.backgroundImage = `url('${songs[0].img}')`;
      }
    });
  </script>

</body>
